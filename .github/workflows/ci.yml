name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - run: dotnet restore CryptArc.slnx

      # Warnings are errors (Directory.Build.props), and Core generates its XML doc
      # file, so an undocumented public member in Core fails here.
      - run: dotnet build CryptArc.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test CryptArc.slnx -c Release --no-build
          --logger "trx;LogFileName=tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      # One cold invocation of every benchmark: catches a benchmark that throws in
      # GlobalSetup or in the measured method. It measures nothing.
      - name: Benchmark smoke test
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project bench/CryptArc.Bench -c Release --no-build -- --filter '*' --job Dry

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          retention-days: 7

  pr-title:
    name: pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # The squash commit on main takes the PR title, so the title must be a Conventional Commit.
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|docs|test|refactor|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must look like 'feat: add LZSS codec' or 'fix(core): ...'. Got: $TITLE"
            exit 1
          fi

  preview:
    name: preview build (win-x64)
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A desktop app has no review URL, so the reviewable artifact is the binary itself.
      # Reviewers grab it from the Actions tab of the pull request and run it locally.
      - name: Publish desktop app
        run: >
          dotnet publish src/CryptArc.App/CryptArc.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o preview/app

      - name: Publish CLI
        run: >
          dotnet publish src/CryptArc.Cli/CryptArc.Cli.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o preview/cli

      - uses: actions/upload-artifact@v4
        with:
          name: cryptarc-preview-win-x64
          path: preview/
          retention-days: 14
